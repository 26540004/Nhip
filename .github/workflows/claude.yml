# Claude fixes bugs reported by the admin's Nhịp, using the owner's Claude Pro plan
# (secret CLAUDE_CODE_OAUTH_TOKEN, created with `claude setup-token`).
# Triggers: a new issue mentioning @claude (report-error writes it into auto-bug issues),
# or any @claude comment by someone with write access. Claude opens a PR; it never merges.
name: Claude
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 60
            --append-system-prompt "Follow CLAUDE.md. Reproduce with a test, fix the root cause, run npm run check, then open a pull request that says 'Fixes #<issue>'. Never merge. Write the PR description in Vietnamese."
            --allowedTools "Bash(npm ci),Bash(npm run *),Bash(npm test *),Bash(npx jest *),Bash(npx tsc *),Bash(npx eslint *),Bash(npx prettier *),Bash(deno check *),Bash(git *),Bash(gh pr create *),Bash(gh pr view *),Bash(gh issue view *)"
